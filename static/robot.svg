<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -32 200 232">
  <!-- body: rounded square, rx=60 (same as F) -->
  <rect x="20" y="20" width="160" height="160" rx="60" fill="#F5F1EA" stroke="#2B2B2B" stroke-width="6"/>
  <!-- one raised eyebrow -->
  <line x1="52" y1="72" x2="84" y2="62" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="70" cy="94" r="7" fill="#2B2B2B"/>
  <!-- winking eye -->
  <path d="M120 96 Q130 86 140 96" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="96" x2="147" y2="90" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
  <!-- smirk -->
  <path d="M78 128 Q104 146 126 122" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round"/>
  <!-- spark of mischief -->
  <path d="M152 46 l0 16 M144 54 l16 0" stroke="#FF6B35" stroke-width="3.5" stroke-linecap="round"/>
  <!-- the cap: orange baseball cap, crown + button + side visor -->
  <path d="M50 28 Q52 -16 100 -16 Q148 -16 150 28 Z" fill="#FF6B35" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M145 25 Q193 26 194 11 Q194 3 182 6 Q157 13 143 21 Z" fill="#FF6B35" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="100" cy="-20" r="5" fill="#F5F1EA" stroke="#2B2B2B" stroke-width="4"/>
</svg>
